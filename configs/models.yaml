models:
  resnet50:
    category: "cnn"
    backbone_mode: "full"
    dropout: 0.3
    pretrained: true
  densenet121:
    category: "cnn"
    backbone_mode: "full"
    dropout: 0.3
    pretrained: true
  efficientnet_b0:
    category: "cnn"
    backbone_mode: "full"
    dropout: 0.3
    pretrained: true
  lstm:
    category: "rnn"
    patch_size: 32
    hidden_dim: 128
    num_layers: 2
    bidirectional: false
    dropout: 0.3
  bilstm:
    category: "rnn"
    patch_size: 32
    hidden_dim: 128
    num_layers: 2
    bidirectional: true
    dropout: 0.3
  resnet50_lstm:
    category: "hybrid"
    backbone: "resnet50"
    backbone_mode: "full"
    hidden_dim: 128
    num_layers: 1
    bidirectional: false
    dropout: 0.3
    pretrained: true
  resnet50_bilstm:
    category: "hybrid"
    backbone: "resnet50"
    backbone_mode: "full"
    hidden_dim: 128
    num_layers: 1
    bidirectional: true
    dropout: 0.3
    pretrained: true
  efficientnet_b0_bilstm:
    category: "hybrid"
    backbone: "efficientnet_b0"
    backbone_mode: "full"
    hidden_dim: 128
    num_layers: 1
    bidirectional: true
    dropout: 0.3
    pretrained: true
  mlp:
    category: "baseline"
    pool_size: 16
    hidden_dims: [256, 128]
    dropout: 0.3
  autoencoder_classifier:
    category: "baseline"
    latent_dim: 128
    recon_size: 64
    dropout: 0.3
    recon_loss_weight: 0.1

