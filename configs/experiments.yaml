    dataset: "fundus"
    task: "fundus_3class"
    mode: "image"
    models:
      - resnet50
      - densenet121
      - efficientnet_b0
      - lstm
      - bilstm
      - resnet50_lstm
      - resnet50_bilstm
      - efficientnet_b0_bilstm
      - mlp
      - autoencoder_classifier

  oct_individual:
    dataset: "oct"
